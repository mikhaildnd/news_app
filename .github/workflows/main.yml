name: linting, testing, building

on:
  push:
    branches: [ main, develop ]

env:
  HUSKY: 0 # отключаем husky внутри CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  # -------------------- LINT --------------------
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Lint TypeScript
        run: npm run lint:ts

      - name: Lint SCSS
        run: npm run lint:scss

  # -------------------- BUILD --------------------
  build:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Build production project
        run: npm run build:prod

  # -------------------- UNIT TESTS --------------------
  unit-tests:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: reports/unit/
  # -------------------- SCREENSHOT TESTS --------------------
  screenshot-tests:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node

      - name: Cache Storybook build
        id: storybook-cache
        uses: actions/cache@v4
        with:
          path: storybook-static
          key: >-
            ${{ runner.os }}-${{ matrix.node-version }}-storybook-
            ${{ hashFiles('package-lock.json', '**/*.stories.@(js|jsx|ts|tsx|mdx)') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.node-version }}-storybook-

      - name: Build Storybook
        if: steps.storybook-cache.outputs.cache-hit != 'true'
        run: npm run storybook:build

      - name: Serve storybook static
        run: |
          npx http-server ./storybook-static -p 6006 >/tmp/storybook.log 2>&1 &
          npx wait-on http://localhost:6006

      - name: Run screenshot tests
        run: npm run test:ui:ci
        continue-on-error: true

      - name: Generate HTML report
        if: always()
        run: npm run test:ui:report

      - name: Move Loki to reports folder
        if: always()
        run: |
          mkdir -p reports
          if [ -d ".loki" ]; then
            mv .loki reports/loki
            echo "Moved .loki to reports/loki"
            echo "Contents of reports/loki:"
            ls -la reports/loki/
          else
            echo ".loki folder not found"
          fi

      - name: Upload screenshot test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-results
          path: reports/loki/

  # -------------------- GENERATE REPORTS --------------------
  generate-reports:
    runs-on: ubuntu-latest
    needs: [ unit-tests, screenshot-tests ]
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare reports structure
        run: |
          mkdir -p reports
          
          if [ -d "artifacts/unit-test-results" ]; then
            mkdir -p reports/unit
            cp -r artifacts/unit-test-results/* reports/unit/
          fi
          
          if [ -d "artifacts/screenshot-test-results" ]; then
            mkdir -p reports/loki
            cp -r artifacts/screenshot-test-results/* reports/loki/
          fi

      - name: Upload reports artifact
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/

  # -------------------- DEPLOY REPORTS --------------------
  deploy-reports:
    runs-on: ubuntu-latest
    needs: generate-reports
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download final reports
        uses: actions/download-artifact@v4
        with:
          name: reports
          path: downloaded-reports/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: downloaded-reports/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show report URL
        run: echo "Reports available at ${{ steps.deployment.outputs.page_url }}"